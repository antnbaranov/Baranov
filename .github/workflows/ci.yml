name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -m1 "iPhone" || true

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Baranov.xcodeproj -scheme Baranov

      - name: Build
        run: |
          set -o pipefail
          DEST="platform=iOS Simulator,name=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [0-9A-Za-z ]*' | head -1 | sed 's/ *$//')"
          echo "Destination: $DEST"
          xcodebuild build \
            -project Baranov.xcodeproj \
            -scheme Baranov \
            -destination "$DEST" \
            -skipPackagePluginValidation \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
